name: Publish expert picks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/expert-picks.yml"
      - "collect-expert-picks.mjs"
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: expert-picks-publisher
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - name: Verify publisher tickets against upcoming fixtures
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node collect-expert-picks.mjs "$RUNNER_TEMP/expert-picks.json"
      - uses: actions/upload-artifact@v4
        with:
          name: expert-picks
          path: ${{ runner.temp }}/expert-picks.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: expert-picks
          path: ${{ runner.temp }}/snapshot
      - name: Publish to the data branch only
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/heads/expert-feed > /dev/null; then
            git fetch --depth=1 origin refs/heads/expert-feed
            git switch -c expert-feed FETCH_HEAD
          elif [[ $? == 2 ]]; then
            git switch --orphan expert-feed
          else
            exit 1
          fi
          cp "$RUNNER_TEMP/snapshot/expert-picks.json" expert-picks.json
          git add -- expert-picks.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh verified expert picks"
          git push origin HEAD:refs/heads/expert-feed
